name: Lima VM Image

# The built-in Lima runtime's VM image: Alpine's cloud image with the
# first-boot packages installed, built without booting it (scripts/
# build-lima-image.sh). That takes Docker, which CI's macOS runners lack, so
# the macOS builds call this, download the artifact and point
# download-lima.sh's LIMA_IMAGE_DIR at it.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build from (default: the calling workflow commit)'
        required: false
        type: string
        default: ''
      save-cache:
        description: 'Keep a newly built image for later builds (only for trusted commits: main and releases)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    # The guest's architecture, so the packages' install scripts run natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      # Only tsx is needed (fetch-lima-packages.ts); skip Electron's postinstall download.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Two builds of the image differ byte for byte, and the app's
      # auto-update downloads every file that changed: reuse the last image
      # while its inputs are unchanged (build-lima-image.sh checks).
      - name: Restore the last VM image
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .lima-image-cache
          key: lima-image-arm64-latest
          restore-keys: lima-image-arm64-

      # An older commit (an on-demand PR build of a branch from before this
      # workflow) has no build script, and its download-lima.sh downloads the
      # stock image itself: hand it an artifact with nothing in it to use.
      - name: Build the VM image
        id: build
        env:
          LIMA_IMAGE_CACHE_DIR: .lima-image-cache
        run: |
          if [ ! -f scripts/build-lima-image.sh ]; then
            mkdir -p build/lima-image
            echo "No VM image: this commit predates scripts/build-lima-image.sh" > build/lima-image/README.txt
            exit 0
          fi
          bash scripts/build-lima-image.sh arm64 build/lima-image
          echo "inputs=$(cat build/lima-image/inputs.sha256)" >> "$GITHUB_OUTPUT"

      - name: Save the VM image for later builds
        if: inputs.save-cache && steps.build.outputs.inputs != '' && steps.restore.outputs.cache-matched-key != format('lima-image-arm64-{0}', steps.build.outputs.inputs)
        uses: actions/cache/save@v4
        with:
          path: .lima-image-cache
          key: lima-image-arm64-${{ steps.build.outputs.inputs }}

      - name: Upload the VM image
        uses: actions/upload-artifact@v4
        with:
          name: lima-image-arm64
          path: build/lima-image/
          retention-days: 5
          # The image is compressed qcow2 and the packages are .apk files.
          compression-level: 0
