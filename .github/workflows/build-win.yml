name: Build Windows App

on:
  push:
    branches: [main]

jobs:
  build-win:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build and sign Windows app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}
        run: npm run dist:win

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # Same cap the release workflow enforces: Cloudflare R2 (wrangler)
          # rejects single objects over 300 MiB. Catch it on the PR.
          limit=$((280 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the 280 MiB release-artifact limit (R2 upload cap is 300 MiB)"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-Windows-${{ github.ref_name }}
          path: release/*.exe
          retention-days: 30

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-Windows-ZIP-${{ github.ref_name }}
          path: release/*.zip
          retention-days: 30
