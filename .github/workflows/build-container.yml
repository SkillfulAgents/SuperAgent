name: Build and Push Container

on:
  push:
    branches: [main]

jobs:
  build-container:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/agent-container-image.yml
    with:
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,prefix=
