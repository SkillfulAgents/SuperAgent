name: Build Mac App Store App

# The Mac App Store build (`npm run dist:mas`, config electron-builder.mas.cjs):
# a signed installer package, sent to App Store Connect. Two workflows call it,
# each after running lima-image.yml:
#   release.yml, for every release (rc and full): it builds once the release has
#       published its agent image, uploads the package, and once App Store Connect
#       has processed it, adds it to the TestFlight groups (testflight job). For a
#       full release that job also leaves the App Store version ready to submit
#       with the build.
#   pr-build.yml, when its `mas` input is ticked: App Store Connect validates the
#       package, and it is never uploaded.
# Without its signing secrets it says so and builds nothing.
#
# Secrets, all for team HL9SP7TJ3J:
#   MAS_CSC_LINK, MAS_CSC_KEY_PASSWORD
#       base64 .p12 of the "Apple Distribution" certificate and its key, and its password
#   MAS_INSTALLER_CSC_LINK, MAS_INSTALLER_CSC_KEY_PASSWORD
#       base64 .p12 of the "3rd Party Mac Developer Installer" (Mac Installer
#       Distribution) certificate and its key, and its password
#   MAS_PROVISIONING_PROFILE
#       base64 of the Mac App Store provisioning profile for so.gamut.app
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
#       the App Store Connect API key the direct build notarizes with, which also
#       validates and uploads this package
#   MAS_ASC_API_KEY_BASE64, MAS_ASC_API_KEY_ID
#       base64 .p8 of an App Store Connect API key with the App Manager role, and
#       its ID, for the testflight job (issuer: APPLE_API_ISSUER, the same team).
#       The notarization key's role adds a build to an internal group but not to
#       an external one, and can't edit an App Store version.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (default: the calling workflow commit)'
        required: false
        type: string
        default: ''
      build-number:
        description: 'CFBundleVersion: App Store Connect takes each number once, and an upload must be higher than the last'
        required: true
        type: string
      require-agent-image:
        description: 'Fail when the agent image this version runs is not published'
        required: false
        type: boolean
        default: true
      app-store-connect:
        description: 'What App Store Connect does with the package: validate or upload'
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 30
      testflight-groups:
        description: 'After an upload, the TestFlight groups to add the build to, comma-separated. An external one submits it for Beta App Review'
        required: false
        type: string
        default: ''
      what-to-test:
        description: "The build's What to Test note in TestFlight"
        required: false
        type: string
        default: ''
      app-store-version:
        description: 'For a full release, its version: the App Store version left ready to submit with this build. Empty for an rc'
        required: false
        type: string
        default: ''
      whats-new:
        description: "What's New for that App Store version, written where it is empty"
        required: false
        type: string
        default: ''
    outputs:
      secrets-set:
        description: "'true' when the signing secrets are set, so the package was built"
        value: ${{ jobs.secrets.outputs.present }}

permissions:
  contents: read

env:
  # The Gamut record's Apple ID (App Store Connect → App Information). altool
  # needs it to find the record: the bundle id alone did not, in the spike.
  MAS_APPLE_ID: '6801340586'

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_INSTALLER_CSC_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          MAS_INSTALLER_CSC_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MAS_CSC_LINK" ] && [ -n "$MAS_CSC_KEY_PASSWORD" ] && [ -n "$MAS_INSTALLER_CSC_LINK" ] \
            && [ -n "$MAS_INSTALLER_CSC_KEY_PASSWORD" ] && [ -n "$MAS_PROVISIONING_PROFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mac App Store build skipped::Its signing secrets are not all set: MAS_CSC_LINK, MAS_CSC_KEY_PASSWORD, MAS_INSTALLER_CSC_LINK, MAS_INSTALLER_CSC_KEY_PASSWORD and MAS_PROVISIONING_PROFILE (see .github/workflows/build-mas.yml)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  build-mas:
    needs: secrets
    if: needs.secrets.outputs.present == 'true'
    runs-on: blacksmith-12vcpu-macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Same pin as build-mac.yml.
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      # For scripts/build-limactl.sh: the Store build's limactl is built from
      # source, without the private Virtualization.framework class in Lima's
      # release binary (https://github.com/lima-vm/lima/issues/5705). The script
      # fetches the Go version Lima's release was built with; any recent Go
      # starts it.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Download the Lima VM image
        uses: actions/download-artifact@v4
        with:
          name: lima-image-arm64
          path: build/lima-image

      - name: Decode the provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.provisionprofile"
          echo "MAS_PROVISIONING_PROFILE=$RUNNER_TEMP/mas.provisionprofile" >> "$GITHUB_ENV"

      - name: Build and sign the Mac App Store package
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
          CSC_FOR_PULL_REQUEST: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          LIMA_IMAGE_DIR: build/lima-image
          MAS_BUILD_NUMBER: ${{ inputs.build-number }}
          AGENT_IMAGE_REQUIRED: ${{ inputs.require-agent-image }}
        run: npm run dist:mas

      # App Review rejects an app whose binaries reference a private
      # Virtualization.framework class, as Lima's release limactl does: make sure
      # the one packaged is the source build.
      - name: Check the packaged limactl references no private classes
        shell: bash
        run: |
          shopt -s nullglob
          limactl=(release/mas-arm64/*.app/Contents/Resources/lima/bin/limactl)
          if [ "${#limactl[@]}" -ne 1 ]; then
            echo "::error::Expected one limactl in release/mas-arm64, found ${#limactl[@]}"
            exit 1
          fi
          if nm -u "${limactl[0]}" | grep -F '_OBJC_CLASS_$__'; then
            echo "::error::The packaged limactl references the private classes above, which App Review rejects (see scripts/build-limactl.sh)"
            exit 1
          fi
          echo "limactl references no private classes"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          # electron-builder writes a mas target into its own folder, named for
          # the target and the runner's architecture, not into release/.
          path: release/mas-arm64/*.pkg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Send the package to App Store Connect (${{ inputs.app-store-connect }})
        shell: bash
        env:
          ACTION: ${{ inputs.app-store-connect }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          case "$ACTION" in
            validate) command=--validate-app ;;
            upload) command=--upload-app ;;
            *) echo "::error::app-store-connect is validate or upload, not '$ACTION'"; exit 1 ;;
          esac
          # Every altool version looks for the key file here, by its id.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          shopt -s nullglob
          packages=(release/mas-arm64/*.pkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one package in release/mas-arm64, found ${#packages[@]}"
            exit 1
          fi
          xcrun altool "$command" -f "${packages[0]}" -t macos --apple-id "$MAS_APPLE_ID" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

  # App Store Connect takes 5–15 minutes to process an upload, so the wait runs
  # here on Linux instead of holding the macOS runner.
  testflight:
    needs: build-mas
    if: inputs.app-store-connect == 'upload' && inputs.testflight-groups != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Same pin as build-mac.yml.
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      # For tsx: the script needs no package's install script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Add the build to its TestFlight groups, and to the App Store version for a full release
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.MAS_ASC_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MAS_ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          GROUPS: ${{ inputs.testflight-groups }}
          WHAT_TO_TEST: ${{ inputs.what-to-test }}
          APP_STORE_VERSION: ${{ inputs.app-store-version }}
          WHATS_NEW: ${{ inputs.whats-new }}
        run: >-
          npx tsx scripts/testflight-distribute.ts --app "$MAS_APPLE_ID" --build "$BUILD_NUMBER"
          --groups "$GROUPS" --what-to-test "$WHAT_TO_TEST"
          --app-store-version "$APP_STORE_VERSION" --whats-new "$WHATS_NEW"
