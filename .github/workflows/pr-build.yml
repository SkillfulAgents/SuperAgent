name: PR Build
run-name: 'PR #${{ inputs.pr_number }} desktop builds'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to build (from this repository)'
        required: true
        type: number
      mas:
        description: 'Also build the Mac App Store package, for App Store Connect to validate (never uploaded)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  resolve-pr:
    runs-on: ubuntu-24.04
    outputs:
      pr-number: ${{ steps.pr.outputs.pr-number }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
    steps:
      - name: Resolve PR commit
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              throw new Error('Enter a positive integer PR number.');
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            // Manual runs have signing secrets; fork PR code must not receive them.
            if (pr.head.repo?.id !== pr.base.repo.id) {
              throw new Error('Signed PR builds require a branch in this repository.');
            }

            core.setOutput('pr-number', pr.number);
            core.setOutput('head-sha', pr.head.sha);
            core.info(`Building PR #${pr.number} at ${pr.head.sha}`);

  lima-image:
    needs: resolve-pr
    uses: ./.github/workflows/lima-image.yml
    with:
      ref: ${{ needs.resolve-pr.outputs.head-sha }}
      # A PR's image must never reach main's or a release's build.
      save-cache: false

  build-mac:
    needs: [resolve-pr, lima-image]
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-pr.outputs.head-sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Download the Lima VM image
        uses: actions/download-artifact@v4
        with:
          name: lima-image-arm64
          path: build/lima-image

      - name: Decode Apple API Key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
          echo "APPLE_API_KEY=/tmp/AuthKey.p8" >> $GITHUB_ENV

      - name: Build and sign macOS app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_FOR_PULL_REQUEST: true
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          LIMA_IMAGE_DIR: build/lima-image
        run: npm run dist:mac

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # A size budget, not a platform limit: the R2 feed upload is multipart
          # and GitHub release assets go to 2 GiB. It catches an installer that
          # balloons unnoticed. The macOS app carries the agent image
          # (scripts/fetch-agent-image.ts, ~730 MiB) and the built-in runtime's
          # VM image with its packages installed, which it also ships to repair
          # it: a DMG of ~1165 MiB.
          limit=$((1300 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the $((limit / 1048576)) MiB release-artifact size budget"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-macOS-DMG
          path: release/*.dmg
          retention-days: 14

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-macOS-ZIP
          path: release/*.zip
          retention-days: 14

  build-mas:
    needs: [resolve-pr, lima-image]
    if: inputs.mas
    uses: ./.github/workflows/build-mas.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve-pr.outputs.head-sha }}
      # Never uploaded, so any number will do.
      build-number: ${{ github.run_number }}
      # A PR may run a version whose image isn't published yet; its package then
      # pulls the image, as the direct build does.
      require-agent-image: false
      app-store-connect: validate
      artifact-name: Gamut-MAS
      retention-days: 14

  build-win:
    needs: resolve-pr
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-pr.outputs.head-sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build and sign Windows app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}
        run: npm run dist:win

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # A size budget, not a platform limit: the R2 feed upload is multipart
          # and GitHub release assets go to 2 GiB. It catches an installer that
          # balloons unnoticed (the Windows one carries both x64 and arm64).
          limit=$((400 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the 400 MiB release-artifact size budget"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-Windows-Setup
          path: release/*.exe
          retention-days: 14

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Superagent-Windows-ZIP
          path: release/*.zip
          retention-days: 14

  comment:
    runs-on: ubuntu-latest
    needs: [resolve-pr, build-mac, build-win, build-mas]
    if: ${{ always() && needs.resolve-pr.result == 'success' }}
    permissions:
      pull-requests: write
    steps:
      - name: Post PR comment with download links
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr-number }}
          PR_HEAD_SHA: ${{ needs.resolve-pr.outputs.head-sha }}
          MAS_REQUESTED: ${{ inputs.mas }}
          MAS_RESULT: ${{ needs.build-mas.result }}
          MAS_SECRETS_SET: ${{ needs.build-mas.outputs.secrets-set }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.PR_HEAD_SHA;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;

            const macResult = '${{ needs.build-mac.result }}';
            const winResult = '${{ needs.build-win.result }}';

            const macStatus = macResult === 'success' ? '✅' : '❌';
            const winStatus = winResult === 'success' ? '✅' : '❌';

            // Only when asked for. Without its signing secrets the job succeeds
            // having built nothing, so that reads as skipped.
            const masResult = process.env.MAS_RESULT;
            const masRow = process.env.MAS_REQUESTED !== 'true' ? []
              : masResult === 'success' && process.env.MAS_SECRETS_SET !== 'true'
                ? ['| Mac App Store (PKG, validated) | ⏭️ skipped: signing secrets not set |']
                : [`| Mac App Store (PKG, validated) | ${masResult === 'success' ? '✅' : '❌'} ${masResult} |`];

            const body = [
              `## 🏗️ PR Build`,
              ``,
              `Built commit: [${headSha.slice(0, 7)}](${commitUrl})`,
              ``,
              `| Platform | Status |`,
              `|----------|--------|`,
              `| macOS (DMG + ZIP) | ${macStatus} ${macResult} |`,
              `| Windows (Installer + ZIP) | ${winStatus} ${winResult} |`,
              ...masRow,
              ``,
              `**[⬇️ Download artifacts from this workflow run](${runUrl}#artifacts)**`,
              ``,
              `<sub>Artifacts are retained for 14 days. You must be signed into GitHub to download.</sub>`,
            ].join('\n');

            // Find existing bot comment to update (sticky comment)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = '## 🏗️ PR Build';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
