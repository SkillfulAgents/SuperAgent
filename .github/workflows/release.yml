name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Extract version + update channel from tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Extract version + channel from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          # Channel = the prerelease identifier (rc/beta/alpha) so electron-builder
          # writes rc-*.yml for prereleases and latest-*.yml for stable. Matches the
          # app's runtime autoUpdater.channel derivation in auto-updater.ts.
          if [[ "$GITHUB_REF_NAME" =~ -([a-zA-Z]+) ]]; then
            echo "channel=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi

  # Build and push agent container with version tag
  build-agent-container:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/superagent-agent-container-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: ./agent-container
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed build cache shared with build-container.yml so
          # release tags reuse main's layers and keep identical digests —
          # clients then pull only the changed top layers between versions.
          # NOTE: ref must be lowercase; github.repository_owner is not.
          cache-from: type=registry,ref=ghcr.io/skillfulagents/superagent-agent-container-base:buildcache
          cache-to: type=registry,ref=ghcr.io/skillfulagents/superagent-agent-container-base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # Build and push app containers with version tags (regular + auth)
  build-app-container:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/superagent

    strategy:
      matrix:
        include:
          - auth_mode: "false"
            tag_suffix: ""
          - auth_mode: "true"
            tag_suffix: "-auth"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
          flavor: |
            latest=false

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUTH_MODE=${{ matrix.auth_mode }}
          cache-from: type=gha,scope=app-${{ matrix.auth_mode }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.auth_mode }}

  # Kick gamut-infra's release-ingest: crane copy the -auth image to ECR,
  # build the MicroVM agent image, register the release_registry row. Needs
  # both container images published first.
  dispatch-release-ingest:
    runs-on: ubuntu-latest
    needs: [prepare, build-agent-container, build-app-container]
    steps:
      - name: Dispatch superagent-release to gamut-infra
        env:
          # Fine-grained PAT (or GitHub App token) with contents:write on
          # SkillfulAgents/gamut-infra — repository_dispatch requires it.
          GH_TOKEN: ${{ secrets.GAMUT_INFRA_DISPATCH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh api repos/SkillfulAgents/gamut-infra/dispatches \
            -f event_type=superagent-release \
            -f "client_payload[version]=$VERSION"

  # Build macOS Electron app (signed + notarized)
  build-mac:
    runs-on: macos-26
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Decode Apple API Key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
          echo "APPLE_API_KEY=/tmp/AuthKey.p8" >> $GITHUB_ENV

      # Write the update channel into package.json's build.publish.channel via
      # Node (value comes from an env var, never a CLI arg) so it can't be mangled
      # by Windows arg-passing — the `-c.publish.channel=` electron-builder flag
      # got split into `-c .publish.channel=rc` through npm -> cmd.exe -> the
      # electron-builder.cmd shim and was read as a config-file path (SUP-283).
      - name: Set update channel
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.build.publish.channel=process.env.UPDATE_CHANNEL;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "build.publish.channel set to $UPDATE_CHANNEL"

      # electron-builder's temporary-keychain path passes the .p12 import password
      # to `security set-key-partition-list -k`, which needs the *keychain* password.
      # Older macOS builds tolerated the mismatch; the macOS 26.6 runner image
      # (20260831+) rejects it and the build dies before signing. Upstream fix
      # (electron-userland/electron-builder#10066, PR #10101) is not released on
      # 26.x yet, so build the keychain here and hand it over via CSC_KEYCHAIN.
      # electron-builder only honours CSC_KEYCHAIN when CSC_LINK is unset, so
      # CSC_LINK/CSC_KEY_PASSWORD must NOT be passed to the build step.
      - name: Set up signing keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/signing.p12"
          case "$CSC_LINK" in
            https://*) curl -fsSL "$CSC_LINK" -o "$CERT" ;;
            *) printf '%s' "$CSC_LINK" | sed -E 's/^data:[^,]*;base64,//' | base64 --decode > "$CERT" ;;
          esac
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock timeout: notarization can run for a long time.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$CERT"
          # Put the new keychain (plus electron-builder's bundled Apple root/
          # intermediate certs, which its own keychain path also adds) on the
          # search list so codesign can build the certificate chain.
          security list-keychains -d user -s "$KEYCHAIN" \
            "$PWD/node_modules/app-builder-lib/certs/root_certs.keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and sign macOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
        run: npm run dist:mac

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # Wrangler (Cloudflare R2 feed upload) rejects single objects over
          # 300 MiB. Fail here, in the build job, rather than discovering it
          # after the GitHub release is already published.
          limit=$((280 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the 280 MiB release-artifact limit (R2 upload cap is 300 MiB)"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap
          retention-days: 5

      - name: Remove signing keychain
        if: always()
        run: |
          # create-keychain writes <name>-db on modern macOS, so don't test the path.
          [ -z "${CSC_KEYCHAIN:-}" ] || security delete-keychain "$CSC_KEYCHAIN" || true

  # Build Windows Electron app
  build-win:
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      # See build-mac: set the channel via Node from an env var so Windows
      # arg-passing can't mangle a `-c.publish.channel=` CLI flag (SUP-283).
      - name: Set update channel
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.build.publish.channel=process.env.UPDATE_CHANNEL;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "build.publish.channel set to $UPDATE_CHANNEL"

      - name: Build and sign Windows app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}
        run: npm run dist:win

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # Wrangler (Cloudflare R2 feed upload) rejects single objects over
          # 300 MiB. Fail here, in the build job, rather than discovering it
          # after the GitHub release is already published.
          limit=$((280 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the 280 MiB release-artifact limit (R2 upload cap is 300 MiB)"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release-artifacts
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap
          retention-days: 5

  # Create GitHub Release with all artifacts
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-agent-container, build-app-container, build-mac, build-win]
    # Mapped from the secret so the R2 upload step can self-gate on its presence
    # (the `secrets` context isn't available in a step `if:` condition).
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-release-artifacts
          path: ./release-artifacts

      - name: Download win artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-release-artifacts
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Superagent ${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

      # Dual-publish bridge (SUP-286): populate the owned R2 feed
      # (updates.gamutagents.com) AFTER the GitHub release is published, so an
      # R2 failure can never block the primary (GitHub) feed during the bridge.
      # It DOES fail this job: from 0.5.21 to 0.5.22 the Windows installer was
      # over wrangler's 300 MiB cap, the loop died on its first file, nothing
      # (not even latest.yml) reached R2, and continue-on-error hid it — the
      # generic feed silently stopped updating. Binaries go first and the feed
      # metadata (latest*.yml) last, so R2 never advertises a version whose
      # binaries are missing. Skipped if the Cloudflare credentials aren't
      # configured. Uses the same CLOUDFLARE_API_TOKEN as the gamut-releases
      # Worker deploy — no separate R2 S3 keys to manage.
      - name: Upload release feed to Cloudflare R2
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          failed=()
          binaries=()
          feeds=()
          for f in ./release-artifacts/*; do
            name="$(basename "$f")"
            # builder-debug.yml is electron-builder's debug dump, not a feed file.
            [ "$name" = "builder-debug.yml" ] && continue
            case "$name" in
              *.yml|*.yaml) feeds+=("$f") ;;
              *)            binaries+=("$f") ;;
            esac
          done

          upload() {
            local f="$1" name
            name="$(basename "$f")"
            echo "→ R2: $name ($(( $(wc -c < "$f") / 1048576 )) MiB)"
            if ! npx --yes wrangler@4 r2 object put "gamut-releases/$name" --file "$f" --remote; then
              echo "::error::R2 upload failed for $name"
              failed+=("$name")
            fi
          }

          for f in "${binaries[@]}"; do upload "$f"; done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Not uploading feed metadata: ${#failed[@]} binary upload(s) failed (${failed[*]}). The R2 feed still points at the previous version."
            exit 1
          fi

          for f in "${feeds[@]}"; do upload "$f"; done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Feed metadata upload failed (${failed[*]}); clients on the R2 feed will not see this release."
            exit 1
          fi
