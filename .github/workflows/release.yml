name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Extract version + update channel from tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Extract version + channel from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          # Channel = the prerelease identifier (rc/beta/alpha) so electron-builder
          # writes rc-*.yml for prereleases and latest-*.yml for stable. Matches the
          # app's runtime autoUpdater.channel derivation in auto-updater.ts.
          if [[ "$GITHUB_REF_NAME" =~ -([a-zA-Z]+) ]]; then
            echo "channel=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi

  # Build and push agent container with version tag
  build-agent-container:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/superagent-agent-container-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: ./agent-container
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed build cache shared with build-container.yml so
          # release tags reuse main's layers and keep identical digests —
          # clients then pull only the changed top layers between versions.
          # NOTE: ref must be lowercase; github.repository_owner is not.
          cache-from: type=registry,ref=ghcr.io/skillfulagents/superagent-agent-container-base:buildcache
          cache-to: type=registry,ref=ghcr.io/skillfulagents/superagent-agent-container-base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # Build and push app containers with version tags (regular + auth)
  build-app-container:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/superagent

    strategy:
      matrix:
        include:
          - auth_mode: "false"
            tag_suffix: ""
          - auth_mode: "true"
            tag_suffix: "-auth"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
          flavor: |
            latest=false

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUTH_MODE=${{ matrix.auth_mode }}
          # Read-only: every release bumps package.json's version, which busts
          # the npm ci layers, so exporting cache here cost minutes and never hit.
          cache-from: type=gha,scope=app-${{ matrix.auth_mode }}

  # Kick gamut-infra's release-ingest: crane copy the -auth image to ECR,
  # build the MicroVM agent image, register the release_registry row. Needs
  # both container images published first.
  dispatch-release-ingest:
    runs-on: ubuntu-latest
    needs: [prepare, build-agent-container, build-app-container]
    steps:
      - name: Dispatch superagent-release to gamut-infra
        env:
          # Fine-grained PAT (or GitHub App token) with contents:write on
          # SkillfulAgents/gamut-infra — repository_dispatch requires it.
          GH_TOKEN: ${{ secrets.GAMUT_INFRA_DISPATCH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh api repos/SkillfulAgents/gamut-infra/dispatches \
            -f event_type=superagent-release \
            -f "client_payload[version]=$VERSION"

  # The built-in Lima runtime's VM image, which the macOS build bundles
  lima-image:
    uses: ./.github/workflows/lima-image.yml

  # Build macOS Electron app (signed + notarized)
  build-mac:
    runs-on: macos-26
    # The app bundles the agent image this release publishes (dist:mac's
    # download:agent-image), so it waits for it: ~35 s when the layers are
    # cached from main. lima-image builds the built-in runtime's VM image.
    needs: [prepare, lima-image, build-agent-container]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Download the Lima VM image
        uses: actions/download-artifact@v4
        with:
          name: lima-image-arm64
          path: build/lima-image

      - name: Decode Apple API Key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
          echo "APPLE_API_KEY=/tmp/AuthKey.p8" >> $GITHUB_ENV

      # Write the update channel into package.json's build.publish.channel via
      # Node (value comes from an env var, never a CLI arg) so it can't be mangled
      # by Windows arg-passing — the `-c.publish.channel=` electron-builder flag
      # got split into `-c .publish.channel=rc` through npm -> cmd.exe -> the
      # electron-builder.cmd shim and was read as a config-file path (SUP-283).
      - name: Set update channel
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.build.publish.channel=process.env.UPDATE_CHANNEL;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "build.publish.channel set to $UPDATE_CHANNEL"

      - name: Build and sign macOS app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          LIMA_IMAGE_DIR: build/lima-image
          # A release never ships without its agent image.
          AGENT_IMAGE_REQUIRED: 'true'
        run: npm run dist:mac

      # Electron 44+ needs macOS 13, and the packaged app says so
      # (LSMinimumSystemVersion), but the feed has to say it too or the updater
      # installs a build that macOS 12 then refuses to open. electron-updater
      # compares the field against os.release(), the Darwin kernel version, so
      # macOS 13 is 22.0.0 ("13.0" is not semver and is ignored). electron-builder
      # has no option for it (electron-userland/electron-builder#8569).
      - name: Pin the macOS floor in the update feed
        run: |
          node -e "
            const fs = require('fs'), yaml = require('js-yaml')
            const feeds = fs.readdirSync('release').filter((f) => f.endsWith('-mac.yml'))
            if (feeds.length === 0) throw new Error('no *-mac.yml feed in release/')
            for (const f of feeds) {
              const path = 'release/' + f
              const info = yaml.load(fs.readFileSync(path, 'utf8'))
              info.minimumSystemVersion = '22.0.0'
              fs.writeFileSync(path, yaml.dump(info, { lineWidth: -1 }))
              console.log(path + ': minimumSystemVersion=' + info.minimumSystemVersion)
            }
          "

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # A size budget, not a platform limit: the R2 feed upload is multipart
          # and GitHub release assets go to 2 GiB. It catches an installer that
          # balloons unnoticed. The macOS app carries the agent image
          # (scripts/fetch-agent-image.ts, ~730 MiB) and the built-in runtime's
          # VM image with its packages installed, which it also ships to repair
          # it: a DMG of ~1165 MiB.
          limit=$((1300 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the $((limit / 1048576)) MiB release-artifact size budget"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap
          retention-days: 5

  # Build Windows Electron app
  build-win:
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      # See build-mac: set the channel via Node from an env var so Windows
      # arg-passing can't mangle a `-c.publish.channel=` CLI flag (SUP-283).
      - name: Set update channel
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');p.build.publish.channel=process.env.UPDATE_CHANNEL;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "build.publish.channel set to $UPDATE_CHANNEL"

      - name: Build and sign Windows app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          PLATFORM_PROXY_URL: ${{ secrets.PLATFORM_PROXY_URL }}
          PLATFORM_AUTH_ISSUER_URL: ${{ secrets.PLATFORM_AUTH_ISSUER_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_CODE_SIGNING_PUBLISHER: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER }}
        run: npm run dist:win

      - name: Enforce release artifact size limit
        shell: bash
        run: |
          # A size budget, not a platform limit: the R2 feed upload is multipart
          # and GitHub release assets go to 2 GiB. It catches an installer that
          # balloons unnoticed (the Windows one carries both x64 and arm64).
          limit=$((400 * 1024 * 1024))
          bad=0
          for f in release/*.exe release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%6d MiB  %s\n' "$((size / 1048576))" "$(basename "$f")"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$(basename "$f") is $((size / 1048576)) MiB, over the 400 MiB release-artifact size budget"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release-artifacts
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap
          retention-days: 5

  # Create GitHub Release with all artifacts
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-agent-container, build-app-container, build-mac, build-win]
    # Mapped from the secret so the R2 upload step can self-gate on its presence
    # (the `secrets` context isn't available in a step `if:` condition).
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-release-artifacts
          path: ./release-artifacts

      - name: Download win artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-release-artifacts
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Superagent ${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

      # Dual-publish bridge (SUP-286): populate the owned R2 feed
      # (updates.gamutagents.com) AFTER the GitHub release is published, so an
      # R2 failure can never block the primary (GitHub) feed during the bridge.
      # It DOES fail this job: from 0.5.21 to 0.5.22 the Windows installer was
      # over wrangler's 300 MiB cap, the loop died on its first file, nothing
      # (not even latest.yml) reached R2, and continue-on-error hid it — the
      # generic feed silently stopped updating. Binaries go first and the feed
      # metadata (latest*.yml) last, so R2 never advertises a version whose
      # binaries are missing. Skipped if the Cloudflare account isn't configured.
      #
      # Uploads go through R2's S3 API, where the AWS CLI splits large files
      # into multipart uploads: wrangler's `r2 object put` refuses anything over
      # 300 MiB, and the Windows installer (x64 + arm64 in one exe) passed that
      # with Electron 45. The S3 API takes its own keys — an R2 API token with
      # Object Read & Write on gamut-releases — not CLOUDFLARE_API_TOKEN.
      - name: Upload release feed to Cloudflare R2
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer AWS CLIs attach checksums to every request by default; only
          # send them where the S3 API requires them.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Missing keys must fail the job: a silently skipped upload is how the
          # feed went stale before (see above).
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set; the R2 feed would not get this release."
            exit 1
          fi
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          shopt -s nullglob
          failed=()
          binaries=()
          feeds=()
          for f in ./release-artifacts/*; do
            name="$(basename "$f")"
            # builder-debug.yml is electron-builder's debug dump, not a feed file.
            [ "$name" = "builder-debug.yml" ] && continue
            case "$name" in
              *.yml|*.yaml) feeds+=("$f") ;;
              *)            binaries+=("$f") ;;
            esac
          done

          upload() {
            local f="$1" name
            name="$(basename "$f")"
            echo "→ R2: $name ($(( $(wc -c < "$f") / 1048576 )) MiB)"
            if ! aws s3 cp "$f" "s3://gamut-releases/$name" --endpoint-url "$endpoint" --only-show-errors; then
              echo "::error::R2 upload failed for $name"
              failed+=("$name")
            fi
          }

          for f in "${binaries[@]}"; do upload "$f"; done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Not uploading feed metadata: ${#failed[@]} binary upload(s) failed (${failed[*]}). The R2 feed still points at the previous version."
            exit 1
          fi

          for f in "${feeds[@]}"; do upload "$f"; done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Feed metadata upload failed (${failed[*]}); clients on the R2 feed will not see this release."
            exit 1
          fi
